<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>তোর সিলেবাস শেষ হইসে ট্র্যাকার</title>
<meta name="description" content="তোর SSC বা HSC সিলেবাসের কতটুকু শেষ হইসে, এক মিনিটে বের করো।">
<meta property="og:title" content="তোর সিলেবাস শেষ হইসে ট্র্যাকার">
<meta property="og:description" content="তোর SSC বা HSC সিলেবাসের কতটুকু শেষ হইসে, এক মিনিটে বের করো।">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/* Design tokens.
 *
 * The two brands are a light theme and a dark theme, not one theme with a
 * swapped accent. Every core colour is sampled from the client's own logo
 * artwork, because the logos ship as opaque JPEGs and the page background
 * exists to match them. Do not retune --bg/--surface/--logo-bg casually.
 *
 * Depth tokens (--grad-*, --glow, --ring-*) are derived FROM those sampled
 * hues, so richer visuals never drift away from the brand.
 */

:root {
  --font-display: 'Baloo Da 2', system-ui, sans-serif;
  --font-body: 'Hind Siliguri', system-ui, sans-serif;

  /* Neutral pre-brand state, shown on the landing screen. */
  --ink: #0d1b2a;
  --ink-soft: #55657a;
  --ink-faint: #8c9bb0;
  --line: #e2e9f2;
  --bg: #f4f8fd;
  --bg-deep: #e8f0fa;
  --surface: #ffffff;
  --surface-2: #fbfdff;

  --accent: #0a6cf0;
  --accent-ink: #ffffff;
  --accent-soft: #e7f0fe;
  --accent-2: #f5a81c;
  --logo-bg: #ffffff;

  --grad-hero: radial-gradient(120% 90% at 15% 0%, #dbe9ff 0%, transparent 60%),
               radial-gradient(100% 80% at 95% 10%, #ffeccb 0%, transparent 55%);
  --glow: 0 0 0 1px rgba(10, 108, 240, .08), 0 18px 40px -12px rgba(10, 60, 140, .22);
  --glow-accent: 0 10px 30px -8px rgba(10, 108, 240, .55);
  --shadow: 0 1px 2px rgba(16, 32, 56, .04), 0 12px 32px -10px rgba(16, 32, 56, .16);
  --shadow-lg: 0 2px 4px rgba(16, 32, 56, .05), 0 28px 60px -18px rgba(16, 32, 56, .28);

  --bad: #d6453d;
  --ok: #1c9d63;

  --r-sm: 12px;
  --r-md: 18px;
  --r-lg: 26px;
  --r-xl: 34px;
  --tap: 44px;

  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;

  --ease: cubic-bezier(.22, 1, .36, 1);
}

/* Infinity School — logo is blue/amber on white, so the page is light. */
body[data-brand='ssc'] {
  --ink: #0d1b2a;
  --ink-soft: #55657a;
  --ink-faint: #6b7c92;
  --line: #dbe6f4;
  --bg: #f4f8fd;
  --bg-deep: #e6f0fb;
  --surface: #ffffff;
  --surface-2: #fbfdff;
  --accent: #0a6cf0;
  --accent-ink: #ffffff;
  --accent-soft: #e7f0fe;
  --accent-2: #f5a81c;
  --logo-bg: #ffffff;
  --grad-hero: radial-gradient(120% 90% at 12% 0%, #d5e6ff 0%, transparent 62%),
               radial-gradient(100% 80% at 96% 8%, #ffe9c2 0%, transparent 55%);
  --glow: 0 0 0 1px rgba(10, 108, 240, .08), 0 18px 40px -12px rgba(10, 60, 140, .22);
  --glow-accent: 0 10px 30px -8px rgba(10, 108, 240, .5);
  --shadow: 0 1px 2px rgba(16, 32, 56, .04), 0 12px 32px -10px rgba(16, 32, 56, .16);
  --shadow-lg: 0 2px 4px rgba(16, 32, 56, .05), 0 28px 60px -18px rgba(16, 32, 56, .26);
  color-scheme: light;
}

/* Hulkenstein — logo is green/white on black, so the page is dark. */
body[data-brand='hsc'] {
  --ink: #f2f5f3;
  --ink-soft: #9db0a5;
  --ink-faint: #8aa093;
  --line: #232c26;
  --bg: #07090a;
  --bg-deep: #040605;
  --surface: #12181a;
  --surface-2: #171f21;
  --accent: #22a94c;
  --accent-ink: #04140a;
  --accent-soft: #12291b;
  --accent-2: #7bed9f;
  --logo-bg: #000000;
  --grad-hero: radial-gradient(120% 90% at 12% 0%, #12301d 0%, transparent 62%),
               radial-gradient(100% 80% at 96% 8%, #0d2416 0%, transparent 55%);
  --glow: 0 0 0 1px rgba(34, 169, 76, .16), 0 18px 40px -12px rgba(0, 0, 0, .7);
  --glow-accent: 0 10px 34px -8px rgba(34, 169, 76, .55);
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 12px 32px -10px rgba(0, 0, 0, .6);
  --shadow-lg: 0 2px 4px rgba(0, 0, 0, .5), 0 28px 60px -18px rgba(0, 0, 0, .75);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  background-image: var(--grad-hero);
  background-attachment: fixed;
  background-repeat: no-repeat;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.65;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* NOTE: do NOT transition background-color/color on <body>.
 * The theme switches by toggling data-brand at runtime, which changes the
 * custom properties those longhands resolve from. Chromium does not restart
 * a running transition when its var() source changes, so the transition
 * sticks and the page keeps the previous theme's background while every
 * child (which has no transition) correctly repaints — the exact symptom
 * that shipped and was caught in review. Theme swaps are instant by design. */

h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.18; letter-spacing: -.01em; }
button, input { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

/* Components. Every interactive element clears the 44px tap floor. */

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
}

/* ---------- buttons ---------- */

.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  min-height: 54px;
  padding: 0 26px;
  border: 0;
  border-radius: 999px;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.1rem;
  letter-spacing: .01em;
  transition: transform .18s var(--ease), box-shadow .25s var(--ease), background .2s var(--ease);
}
.btn:active { transform: translateY(2px) scale(.99); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.btn--primary {
  background: var(--accent);
  color: var(--accent-ink);
  box-shadow: var(--glow-accent);
}
.btn--primary:hover { transform: translateY(-2px); }

.btn--ghost {
  background: transparent;
  color: var(--ink-soft);
  border: 1.5px solid var(--line);
  box-shadow: none;
  font-size: 1rem;
}
.btn--ghost:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- choice tiles ---------- */

.choice {
  position: relative;
  display: flex;
  align-items: center;
  gap: 16px;
  width: 100%;
  min-height: 72px;
  padding: 18px 22px;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: var(--r-md);
  box-shadow: var(--shadow);
  text-align: start;
  font-family: var(--font-display);
  font-size: 1.2rem;
  color: var(--ink);
  overflow: hidden;
  transition: transform .2s var(--ease), border-color .2s var(--ease),
              box-shadow .25s var(--ease), background .2s var(--ease);
}
/* Accent rail that fills in on hover/selection. */
.choice::before {
  content: '';
  position: absolute;
  inset-inline-start: 0;
  inset-block: 0;
  width: 5px;
  background: var(--accent);
  transform: scaleY(0);
  transform-origin: bottom;
  transition: transform .28s var(--ease);
}
.choice::after {
  content: '';
  margin-inline-start: auto;
  width: 11px; height: 11px;
  border-inline-end: 2.5px solid var(--ink-faint);
  border-block-start: 2.5px solid var(--ink-faint);
  transform: rotate(45deg);
  transition: border-color .2s var(--ease), transform .2s var(--ease);
}
.choice:hover {
  transform: translateY(-3px);
  border-color: var(--accent);
  box-shadow: var(--shadow-lg);
}
.choice:hover::before, .choice.is-selected::before { transform: scaleY(1); }
.choice:hover::after { border-color: var(--accent); transform: rotate(45deg) translate(2px, -2px); }
.choice.is-selected {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.choice.is-selected::after { border-color: var(--accent); }

/* ---------- checkboxes ---------- */

.check {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  min-height: var(--tap);
  padding: 10px 12px;
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: background .18s var(--ease);
}
.check:hover { background: var(--accent-soft); }
.check input {
  flex: 0 0 auto;
  width: 23px;
  height: 23px;
  margin: 3px 0 0;
  accent-color: var(--accent);
  cursor: pointer;
}
.check.is-locked { opacity: .72; cursor: default; }
.check__label { flex: 1; line-height: 1.5; }

@keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.28); } 100% { transform: scale(1); } }
.check input:checked { animation: pop .24s var(--ease); }

/* ---------- accordion ---------- */

.accordion {
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: box-shadow .25s var(--ease), border-color .2s var(--ease);
}
.accordion:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.accordion + .accordion { margin-top: 14px; }

.accordion__head {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  min-height: 64px;
  padding: 14px 18px;
  background: none;
  border: 0;
  font-family: var(--font-display);
  font-size: 1.12rem;
  color: var(--ink);
  text-align: start;
}
.accordion__count {
  font-family: var(--font-body);
  font-size: .9rem;
  font-weight: 600;
  color: var(--ink-soft);
  padding: 4px 12px;
  border-radius: 999px;
  background: var(--accent-soft);
  white-space: nowrap;
}
.accordion__chev {
  width: 9px; height: 9px;
  border-inline-end: 2.5px solid var(--ink-faint);
  border-block-end: 2.5px solid var(--ink-faint);
  transform: rotate(45deg);
  transition: transform .28s var(--ease);
}
.accordion__head[aria-expanded='true'] .accordion__chev { transform: rotate(-135deg); }
.accordion__body { padding: 2px 12px 16px; }
.accordion__body[hidden] { display: none; }
.paper-label {
  margin: 12px 0 4px;
  padding-inline-start: 12px;
  font-family: var(--font-display);
  font-size: .82rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

/* ---------- bars and ring ---------- */

.bar { height: 7px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar__fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width .55s var(--ease);
}

.ring { display: block; transform: rotate(-90deg); overflow: visible; }
.ring__track { fill: none; stroke: var(--line); stroke-width: 11; }
.ring__fill {
  fill: none;
  stroke: var(--accent);
  stroke-width: 11;
  stroke-linecap: round;
  stroke-dasharray: 326.7;
  filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 55%, transparent));
  transition: stroke-dashoffset .7s var(--ease);
}

/* ---------- fields ---------- */

.field { display: block; margin-bottom: 20px; }
.field__label {
  display: block;
  margin-bottom: 8px;
  font-family: var(--font-display);
  font-size: .95rem;
  color: var(--ink-soft);
}
.field__input {
  width: 100%;
  min-height: 54px;
  padding: 12px 18px;
  border: 1.5px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface);
  color: var(--ink);
  transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.field__input::placeholder { color: var(--ink-faint); }
.field__input:focus {
  border-color: var(--accent);
  outline: none;
  box-shadow: 0 0 0 4px var(--accent-soft);
}
.field__error {
  display: block;
  margin-top: 7px;
  color: var(--bad);
  font-size: .9rem;
  min-height: 1.2em;
}

/* ---------- misc ---------- */

.pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 16px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-family: var(--font-display);
  font-size: .88rem;
  letter-spacing: .04em;
}
body[data-brand='hsc'] .pill { color: var(--accent-2); }

.divider {
  height: 1px;
  border: 0;
  margin: var(--sp-5) 0;
  background: linear-gradient(90deg, transparent, var(--line), transparent);
}

/* Screen layout, hero treatment and motion. */

.wrap {
  position: relative;
  width: min(680px, 100% - 32px);
  margin-inline: auto;
  padding-block: 18px 110px;
  z-index: 1;
}

/* Decorative orbs behind the content. Purely presentational, aria-hidden. */
.orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  opacity: .5;
}
.orb--1 { width: 320px; height: 320px; top: -90px; inset-inline-start: -80px; background: var(--accent); opacity: .16; }
.orb--2 { width: 260px; height: 260px; top: 32%; inset-inline-end: -110px; background: var(--accent-2); opacity: .13; }
.orb--3 { width: 300px; height: 300px; bottom: -120px; inset-inline-start: 20%; background: var(--accent); opacity: .1; }

.screen { display: none; }
.screen.is-active { display: block; animation: rise .45s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

.stagger > * { animation: rise .5s var(--ease) both; }
.stagger > *:nth-child(1) { animation-delay: .04s; }
.stagger > *:nth-child(2) { animation-delay: .09s; }
.stagger > *:nth-child(3) { animation-delay: .14s; }
.stagger > *:nth-child(4) { animation-delay: .19s; }
.stagger > *:nth-child(5) { animation-delay: .24s; }
.stagger > *:nth-child(6) { animation-delay: .29s; }
.stagger > *:nth-child(7) { animation-delay: .34s; }
.stagger > *:nth-child(n + 8) { animation-delay: .38s; }

/* ---------- top bar ---------- */

.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px 0 10px;
}
.topbar__title {
  font-family: var(--font-display);
  font-size: 1rem;
  color: var(--ink-soft);
  line-height: 1.3;
}
/* Logos ship as opaque JPEGs, so each sits on a chip filled with its own
   background colour. On the matching theme the chip is invisible. */
.topbar__chip {
  display: inline-flex;
  align-items: center;
  padding: 6px 10px;
  background: var(--logo-bg);
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  line-height: 0;
  flex: 0 0 auto;
}
.topbar__logo { height: 34px; width: auto; display: block; }

/* ---------- hero ---------- */

.hero { padding-block: var(--sp-4) var(--sp-5); }
.hero__title {
  font-size: clamp(2rem, 8.5vw, 3.1rem);
  font-weight: 800;
  margin-bottom: 14px;
}
.hero__title .hl {
  background: linear-gradient(100deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero__sub {
  color: var(--ink-soft);
  font-size: 1.08rem;
  max-width: 46ch;
  margin: 0;
}

/* Both school logos, shown together before a level is chosen. */
.brandpair {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-bottom: var(--sp-5);
  flex-wrap: wrap;
}
.brandpair__item {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px 18px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  transition: transform .3s var(--ease), box-shadow .3s var(--ease);
}
.brandpair__item:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.brandpair__item img { height: 52px; width: auto; display: block; }
.brandpair__x {
  font-family: var(--font-display);
  color: var(--ink-faint);
  font-size: 1.1rem;
}

.stack { display: grid; gap: 14px; margin-top: var(--sp-5); }

.formcard {
  padding: var(--sp-5);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--glow);
}

/* ---------- progress dock ---------- */

.dock {
  position: sticky;
  top: 10px;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 16px 18px;
  margin-bottom: var(--sp-5);
  background: color-mix(in srgb, var(--surface) 82%, transparent);
  backdrop-filter: blur(14px) saturate(1.4);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg);
}
.dock__pct {
  font-family: var(--font-display);
  font-size: 2.1rem;
  font-weight: 800;
  line-height: 1;
  color: var(--accent);
}
.dock__meta { color: var(--ink-soft); font-size: .93rem; }

/* ---------- enrolment ---------- */

.enrol {
  position: relative;
  margin-top: var(--sp-6);
  padding: var(--sp-5);
  border: 1.5px solid var(--accent);
  border-radius: var(--r-lg);
  background: var(--accent-soft);
  box-shadow: var(--glow);
}
.enrol h3 { font-size: 1.22rem; margin-bottom: var(--sp-4); }
.enrol .choice { background: var(--surface); }
.enrol__verdict {
  margin: var(--sp-4) 0 0;
  padding: var(--sp-4);
  border-radius: var(--r-sm);
  background: var(--surface);
  font-family: var(--font-display);
  font-size: 1.12rem;
  line-height: 1.45;
  animation: rise .4s var(--ease) both;
}

/* ---------- result ---------- */

.result { text-align: center; }
.result__pct {
  font-family: var(--font-display);
  font-size: clamp(4rem, 22vw, 7rem);
  font-weight: 800;
  line-height: 1;
  background: linear-gradient(100deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-block: var(--sp-3);
}
.result__img {
  width: min(300px, 78vw);
  height: auto;
  margin: var(--sp-5) auto;
  border-radius: var(--r-md);
  box-shadow: var(--shadow-lg);
  display: block;
}
.result__actions { display: grid; gap: 12px; margin-top: var(--sp-5); }

@media (min-width: 560px) {
  .result__actions { grid-template-columns: 1fr 1fr; }
  .result__actions > *:last-child { grid-column: 1 / -1; }
  .brandpair__item img { height: 60px; }
}
</style>

<div id="app"></div>
<script>(function(){
'use strict';
const CONFIG = {
  // Filled in during Task 12 after the Apps Script web app is deployed.
  appsScriptUrl: '',

  // Enrolment destinations. Supplied by the client in Task 15.
  enrolUrls: {
    ssc: '',
    hsc: '',

const SCHEMA_VERSION = 2;

    ...state,

  const i = FLOW.indexOf(state.screen);
  if (i === -1) return null;
  let next = i + delta;
  // SSC has fixed subjects, so the picker is skipped in both directions.
  if (FLOW[next] === 'subjects' && !needsSubjectPicker(state.level)) next += delta;
  // Enrolled students are never asked for contact details.
  if (FLOW[next] === 'lead' && state.enrolled === true) next += delta;

    return parsed;
  } catch {
    return null;
  }
}

  }

  } catch {

  }

// Apps Script does not answer CORS preflight requests. Sending the body as
// text/plain keeps the request "simple" so no preflight is issued at all;
// the endpoint reads it from e.postData.contents regardless of the header.
async function postJson(url, payload) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
    redirect: 'follow',
  });
  return res.ok;
}

// Fallback for in-app webviews that block or mangle fetch. A form POST into a
// hidden iframe cannot be read back, so success is assumed; a dropped lead is
// preferable to a student stuck on a spinner.
function postViaForm(url, payload) {
  return new Promise((resolve) => {
    const name = `s${Date.now()}`;
    const iframe = document.createElement('iframe');
    iframe.name = name;
    iframe.style.display = 'none';

    const form = document.createElement('form');
    form.action = url;
    form.method = 'POST';
    form.target = name;
    form.style.display = 'none';

    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'payload';
    input.value = JSON.stringify(payload);
    form.append(input);

    document.body.append(iframe, form);
    iframe.addEventListener('load', () => {
      iframe.remove();
      form.remove();
      resolve(true);
    });
    form.submit();
    setTimeout(() => resolve(true), 4000);

  }
  for (let attempt = 0; attempt < 2; attempt += 1) {
    try {
      if (await postJson(url, payload)) return true;
    } catch (err) {
      console.warn('Lead submission attempt failed', err);
    }
  }
  try {
    return await postViaForm(url, payload);
  } catch {

  }

const RING_CIRCUMFERENCE = 326.7; // 2πr, r = 52

function progressDock(percent, completed, total) {
  // Built with createElementNS rather than el(), because el() uses
  // createElement and would produce an unstyled HTMLUnknownElement for <svg>.
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'ring');
  svg.setAttribute('viewBox', '0 0 120 120');
  svg.setAttribute('width', '64');
  svg.setAttribute('height', '64');
  svg.innerHTML =
    `<circle class="ring__track" cx="60" cy="60" r="52"></circle>` +
    `<circle class="ring__fill" cx="60" cy="60" r="52" ` +
    `style="stroke-dashoffset:${RING_CIRCUMFERENCE * (1 - percent / 100)}"></circle>`;

  return el('div', { class: 'dock' }, svg,
    el('div', {},
      el('div', { class: 'dock__pct', 'aria-live': 'polite', text: `${percent}%` }),
      el('div', { class: 'dock__meta', text: `${completed} / ${total} চ্যাপ্টার শেষ` })),
  );
}

registerScreen('syllabus', (state, h) => {
  const all = getSubjects(state.level, state.batch, state.group);
  const chosen = new Set(state.selectedSubjects);
  const subjects = all.filter((s) => chosen.has(s.id));
  const checked = new Set(state.checked);

  const { completed, total, percent } = computeCompletion(subjects, checked);
  const breakdown = new Map(computeSubjectBreakdown(subjects, checked).map((r) => [r.id, r]));

  const accordions = subjects.map((s, i) => {
    const row = breakdown.get(s.id);
    const body = el('div', { class: 'accordion__body', hidden: i !== 0 });

    for (const paper of s.papers) {
      if (paper.name) body.append(el('h3', { class: 'paper-label', text: paper.name }));
      for (const c of paper.chapters) {
        body.append(el('label', { class: 'check' },
          el('input', {
            type: 'checkbox', checked: checked.has(c.id),
            onchange: () => h.onToggleChapter(c.id),
          }),
          el('span', { class: 'check__label', text: c.name })));
      }

    // main.js), so the initial aria-expanded value must match the initial
    // `hidden` state above (first accordion open, rest closed) rather than
    // assuming a default — there is no persistent DOM to fall back on.
    const head = el('button', {
      class: 'accordion__head', type: 'button', 'aria-expanded': i === 0 ? 'true' : 'false',
    },
      el('span', { style: 'flex:1' }, s.name),
      el('span', { class: 'accordion__count', text: `${row.completed}/${row.total}` }),
      el('span', { class: 'accordion__chev', 'aria-hidden': 'true' }));
    head.addEventListener('click', () => {

    return el('div', { class: 'accordion' }, head, bar, body);

    el('div', { class: 'stack' }, ...accordions),
    enrolBlock(state, h),
    el('div', { class: 'stack' },

      const result = computeCompletion(subjects, new Set(next.checked));
      const tier = resolveTier(result.percent, next.batch);

      submitLead(buildPayload(next, subjects, result, tier, utm))
